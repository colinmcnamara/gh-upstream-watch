[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[project]
name = "gh-upstream-watch"
version = "0.3.0"
description = "Read-only alerts for your upstream work: tells you the next action when a maintainer gate, a competing PR, or a review moves."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Colin McNamara", email = "colin@2cups.com" }]
dependencies = []
keywords = ["github", "gh-extension", "open-source", "notifications", "maintainers"]
classifiers = [
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Version Control :: Git",
]

[project.urls]
Homepage = "https://github.com/colinmcnamara/gh-upstream-watch"
Issues = "https://github.com/colinmcnamara/gh-upstream-watch/issues"
Changelog = "https://github.com/colinmcnamara/gh-upstream-watch/blob/main/CHANGELOG.md"

[project.scripts]
gh-upstream-watch = "gh_upstream_watch.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = ["B904"]
