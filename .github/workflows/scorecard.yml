name: scorecard

# OpenSSF Scorecard: an outside check of this repository's security practices, published to
# api.securityscorecards.dev for the README badge. Publishing restricts this workflow: no top-level
# env or write permissions, only approved actions in the job, id-token only here.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"  # Mondays
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      security-events: write  # the SARIF goes to code scanning
      id-token: write  # signs the published result
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
