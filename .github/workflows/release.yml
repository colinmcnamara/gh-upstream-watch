name: release

# Tag vX.Y.Z -> build once -> TestPyPI -> PyPI -> GitHub Release with the CHANGELOG section.
# PyPI uses trusted publishing (OIDC): no token is stored. Configure a trusted publisher for this
# repo, workflow release.yml, on both pypi.org and test.pypi.org (environments pypi / testpypi).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.10.12"
      - name: Tag must match both version sources, and CHANGELOG must have notes (before any upload)
        run: |
          v=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/gh_upstream_watch/__init__.py)
          p=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          test "v$v" = "$GITHUB_REF_NAME" && test "$p" = "$v" || { echo "tag $GITHUB_REF_NAME, __init__ $v, pyproject $p"; exit 1; }
          awk -v h="## [$v]" 'index($0, h) == 1 && (length($0) == length(h) || substr($0, length(h) + 1, 1) == " ") {on=1; next} /^## / {on=0} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || { echo "no CHANGELOG section for $v"; exit 1; }
      - run: scripts/check-personal-data.sh
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv build
      - run: mv "$RUNNER_TEMP/notes.md" dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.10.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - run: uv publish --trusted-publishing always --publish-url https://test.pypi.org/legacy/ dist/*.whl dist/*.tar.gz
      - name: Install from TestPyPI and run it before PyPI gets anything
        run: |
          v="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 18); do  # TestPyPI's index can lag the upload by a minute or two
            uvx --no-cache --default-index https://test.pypi.org/simple/ --from "gh-upstream-watch==$v" \
              gh-upstream-watch --version | grep -qx "gh-upstream-watch $v" && exit 0
            sleep 10
          done
          echo "gh-upstream-watch $v did not install from TestPyPI"; exit 1

  pypi:
    needs: testpypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.10.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - run: uv publish --trusted-publishing always dist/*.whl dist/*.tar.gz

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - run: mv dist/notes.md notes.md
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
