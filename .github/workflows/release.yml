name: release

# Tag vX.Y.Z -> build and test once -> TestPyPI -> smoke test from TestPyPI -> PyPI (a person
# approves the `pypi` environment) -> GitHub Release with the CHANGELOG section.
# Publishing uses trusted publishing (OIDC): no token is stored. pypa/gh-action-pypi-publish also
# makes PEP 740 attestations (signed provenance) for exactly the files it uploads.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false  # never cancel a release halfway

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write  # signs the build provenance (Sigstore); no test code runs in this job
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.10.12"
          enable-cache: false  # a release never builds from a cache another run wrote
      - name: Tag must match both version sources, and CHANGELOG must have notes (before any upload)
        run: |
          v=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/gh_upstream_watch/__init__.py)
          p=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          test "v$v" = "$GITHUB_REF_NAME" && test "$p" = "$v" || { echo "tag $GITHUB_REF_NAME, __init__ $v, pyproject $p"; exit 1; }
          awk -v h="## [$v]" 'index($0, h) == 1 && (length($0) == length(h) || substr($0, length(h) + 1, 1) == " ") {on=1; next} /^## / {on=0} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || { echo "no CHANGELOG section for $v"; exit 1; }
      - run: scripts/check-personal-data.sh
      - run: uv lock --check
      - run: uv build --clear
      # Signed provenance for both files: `gh attestation verify FILE --repo OWNER/REPO` checks it,
      # and the bundle is attached to the GitHub Release.
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - run: |
          mkdir -p "$RUNNER_TEMP/release"
          cp "$BUNDLE" "$RUNNER_TEMP/release/gh_upstream_watch-${GITHUB_REF_NAME#v}.sigstore.json"
          mv "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/release/notes.md"
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-extras
          path: ${{ runner.temp }}/release/

  # The tests get their own job: the build job can sign, and no test code or test tool should run
  # next to that token. Every publishing job needs this one to pass.
  test-dist:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.10.12"
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: The exact files we publish pass the whole suite, installed (wheel), and run on their own (sdist)
        run: scripts/test-wheel.sh 3.10

  testpypi:
    needs: [build, test-dist]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: testpypi
    permissions:
      id-token: write  # this job only uploads: no package code runs next to the token
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  testpypi-smoke:
    needs: testpypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.10.12"
          enable-cache: false
          ignore-empty-workdir: true
      - name: Install from TestPyPI and run it before PyPI gets anything
        run: |
          v="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 18); do  # TestPyPI's index can lag the upload by a minute or two
            uvx --no-cache --default-index https://test.pypi.org/simple/ --from "gh-upstream-watch==$v" \
              gh-upstream-watch --version | grep -qx "gh-upstream-watch $v" && exit 0
            sleep 10
          done
          echo "gh-upstream-watch $v did not install from TestPyPI"; exit 1

  pypi:
    needs: testpypi-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-extras
          path: extras/
      # The package files plus the signed provenance bundle (`.sigstore.json`). Releases are
      # immutable: gh uploads to a draft, then publishes, after which nothing can change.
      - run: gh release create "$GITHUB_REF_NAME" dist/* extras/*.sigstore.json --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file extras/notes.md
        env:
          GH_TOKEN: ${{ github.token }}
