name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:  # a new push to a PR cancels its older run; main keeps every run
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.14"]  # the floor and the newest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.10.12"
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --locked --python ${{ matrix.python }}
      - name: Tests, with branch coverage (fails under the floor in pyproject.toml)
        run: |
          uv run --python ${{ matrix.python }} coverage run -m pytest -q
          uv run --python ${{ matrix.python }} coverage report
      - run: uv run --python ${{ matrix.python }} ruff check .
      - run: uv run --python ${{ matrix.python }} mypy
      - name: Build, then run the whole suite against the installed wheel (not src/)
        run: |
          uv build --clear
          scripts/test-wheel.sh ${{ matrix.python }}
      - name: gh extension shim, run the way `gh extension install` runs it
        run: |
          ./gh-upstream-watch --help
          env python3 ./gh-upstream-watch --help
      - name: Demo on recorded fixtures
        run: PYTHON=.venv/bin/python scripts/demo.sh

  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Personal-data gate
        run: scripts/check-personal-data.sh
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.10.12"
      - run: uv lock --check
      - name: Secret scan (full history)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Workflow security lint (zizmor; fails on findings)
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
