version: 2
updates:
  # Keeps the SHA-pinned actions current; Dependabot updates the SHA and the version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # Dev tools in uv.lock (pytest, ruff, mypy, coverage). The package itself has no dependencies.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tools:
        patterns: ["*"]
